# Pemeriksaan otomatis: aturan akses backend (401/403), keutuhan migrasi,
# pemeriksaan statis, dan penjagaan riwayat/dependensi.
#
# Empat hal yang dijaga:
#   1. uji-akses  — setiap endpoint backend punya aturan peran yang TERTULIS dan
#                   TERUJI. Rute baru tanpa baris harapan akan menggagalkan job
#                   ini; lihat backend/src/tests/uji-akses-rute.ts.
#   2. migrasi    — folder prisma/migrations masih bisa diterapkan dari basis
#                   data kosong, dan hasilnya sama dengan schema.prisma.
#   3. statis     — type-check backend, lint + build frontend.
#   4. keamanan   — Pencegahan §4 SECURITY.md dijalankan sendiri oleh runner,
#                   bukan diingat-ingat orang: dump/unggahan tak masuk diff,
#                   gitleaks menyapu riwayat, audit dependensi, dan frontend
#                   masih mendeklarasikan header keamanannya.
#
# Semuanya berjalan di runner sementara dengan MySQL kosong.
name: uji-akses

on:
  push:
    branches: [main]
  pull_request:

jobs:
  uji-akses:
    name: Aturan akses 401/403
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bem_ft_uji
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      # Basis data runner bersifat sementara dan dibuang setelah job selesai.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/bem_ft_uji
      # Kunci khusus pengujian, bukan kunci produksi.
      JWT_SECRET: kunci-uji-ci-bukan-untuk-produksi
      NODE_ENV: test
      API_URL: http://localhost:3000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pasang dependensi backend
        working-directory: backend
        run: npm ci

      - name: Siapkan Prisma Client
        working-directory: backend
        run: npx prisma generate

      # Skema dibentuk lewat migrasi (bukan `db push`) supaya yang diuji adalah
      # skema yang sama dengan yang dipakai produksi. Keutuhan folder migrasi
      # sendiri dijaga oleh job "migrasi" di bawah.
      - name: Terapkan migrasi
        working-directory: backend
        run: npx prisma migrate deploy

      # Retensi dibangun dan diukur di MariaDB 10.4, produksinya MySQL 8.4: DELETE/UPDATE
      # ... LIMIT tanpa ORDER BY adalah perilaku per mesin (binlog & perencana). Langkah ini
      # menjalankan kelima pernyataan itu di atas mysql:8 dengan RETENSI_AKTIF=1 dan memastikan
      # yang hilang persis baris tua. Sengaja SEBELUM server dinyalakan: tabelnya hanya berisi
      # baris berpenanda, jadi selisih hitungan bisa dipastikan.
      - name: Retensi — verifikasi 5 pernyataan di MySQL 8
        working-directory: backend
        env:
          RETENSI_AKTIF: '1'
        run: npm run uji:retensi

      # Penomoran tiket (B2.6) sebelumnya hanya terbukti lewat stub $queryRaw di job tanpa DB.
      # Langkah ini menjalankan SQL MAX yang SAMA di atas mysql:8, di basis data runner yang
      # baru dimigrasi dan masih kosong; skripnya menolak bila hari itu sudah ada tiket lain
      # dan membersihkan baris uji sendiri.
      - name: Penomoran tiket — SQL MAX dieksekusi di MySQL 8
        working-directory: backend
        run: npm run uji:nomor-tiket

      - name: Bangun backend
        working-directory: backend
        run: npm run build

      - name: Nyalakan server backend
        working-directory: backend
        run: |
          node dist/index.js > $GITHUB_WORKSPACE/server.log 2>&1 &
          echo "PID server: $!"

      - name: Tunggu server siap
        working-directory: backend
        run: |
          for percobaan in $(seq 1 30); do
            if curl -sf "$API_URL/health" > /dev/null; then
              echo "Server siap pada percobaan ke-$percobaan."
              exit 0
            fi
            sleep 1
          done
          echo "Server tidak siap setelah 30 detik. Log server:"
          cat $GITHUB_WORKSPACE/server.log
          exit 1

      # Matriks seluruh endpoint: tamu / mahasiswa / pengurus / admin.
      - name: Uji matriks akses seluruh endpoint
        working-directory: backend
        run: npm test

      # Melengkapi matriks: login sungguhan + memastikan balasan 403 ekspor
      # benar-benar tidak memuat isi CSV.
      - name: Uji akses non-admin (login sungguhan)
        working-directory: backend
        run: npm run verifikasi:akses

      - name: Tampilkan log server bila gagal
        if: failure()
        run: cat $GITHUB_WORKSPACE/server.log

  migrasi:
    name: Migrasi dari basis data kosong
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bem_ft_migrasi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/bem_ft_migrasi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pasang dependensi backend
        working-directory: backend
        run: npm ci

      - name: Siapkan Prisma Client
        working-directory: backend
        run: npx prisma generate

      # Basis data service di atas benar-benar kosong, jadi langkah ini membuktikan
      # seluruh folder prisma/migrations masih bisa diterapkan dari nol (tidak ada
      # migrasi yang hilang, terhapus, atau saling bergantung secara kacau).
      - name: Terapkan seluruh migrasi dari basis data kosong
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Tampilkan status migrasi
        working-directory: backend
        run: npx prisma migrate status

      # Statement pemulihan di 20261103225534 hanya bekerja kalau ada data, jadi
      # `migrate deploy` di atas (basis data kosong) tidak membuktikan apa-apa soal
      # baris itu. Langkah ini meniru keadaan produksi: satu akun dengan maxDevices
      # 10 plus satu AuditLog DEVICE_LIMIT "... dari 2 menjadi 5", lalu file migrasi
      # yang sama dijalankan ulang. Angka yang benar adalah 5 — bukan 3 (kalau
      # UPDATE perataan menang) dan bukan 10 (kalau JOIN-nya diam-diam no-op).
      # Dijalankan di MySQL 8 asli karena MariaDB staging sudah membuktikan bentuk
      # UPDATE ... JOIN ini; yang belum terbukti adalah MySQL 8 (Aiven 8.4.11).
      - name: Batas yang diberikan admin harus dipulihkan dari AuditLog
        working-directory: backend
        run: |
          cat > p7c-benih.sql <<'SQL'
          INSERT INTO `User` (`id`, `nim`, `password_hash`, `maxDevices`, `updatedAt`)
          VALUES ('p7c-benih-1', '99990700', 'bukan-hash-nyata', 10, NOW(3));

          INSERT INTO `AuditLog` (`id`, `action`, `entityType`, `entityId`, `description`)
          VALUES ('p7c-audit-1', 'DEVICE_LIMIT', 'User', 'p7c-benih-1',
                  'Mengubah batas perangkat 99990700 dari 2 menjadi 5');
          SQL

          cat > p7c-baca.cjs <<'JS'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();

          (async () => {
            const [versi] = await prisma.$queryRawUnsafe('SELECT VERSION() AS v');
            const [akun] = await prisma.$queryRawUnsafe(
              "SELECT maxDevices FROM User WHERE id = 'p7c-benih-1'"
            );
            await prisma.$disconnect();
            console.log(`Versi basis data: ${versi.v}`);
            if (!akun || akun.maxDevices !== 5) {
              console.error(
                `::error::maxDevices akun benih = ${akun ? akun.maxDevices : 'TIDAK ADA BARIS'}, harus 5.`
              );
              process.exit(1);
            }
            console.log('Batas perangkat dipulihkan dari AuditLog: maxDevices = 5.');
          })().catch(async (error) => {
            console.error(error);
            await prisma.$disconnect();
            process.exit(1);
          });
          JS

          npx prisma db execute --schema prisma/schema.prisma --file p7c-benih.sql
          npx prisma db execute --schema prisma/schema.prisma \
            --file prisma/migrations/20261103225534_batas_perangkat_tiga/migration.sql
          node p7c-baca.cjs
          rm -f p7c-benih.sql p7c-baca.cjs

      # `--exit-code` dari `migrate diff`: 0 = tidak ada perbedaan, 2 = ada
      # perbedaan, 1 = gagal dijalankan. Perbedaan berarti isi schema.prisma
      # sudah berubah tanpa migrasi baru — persis keadaan yang membuat produksi
      # dan pengembangan berbeda diam-diam.
      - name: Pastikan hasil migrasi sama dengan schema.prisma
        working-directory: backend
        run: |
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          kode=$?
          set -e

          if [ "$kode" -eq 2 ]; then
            echo "::error::Skema hasil migrasi BERBEDA dari schema.prisma. Buat migrasi baru dengan 'npx prisma migrate dev' di folder backend, lalu commit folder prisma/migrations."
            exit 1
          fi

          if [ "$kode" -ne 0 ]; then
            echo "::error::Pemeriksaan migrasi gagal dijalankan (exit $kode)."
            exit 1
          fi

          echo "Migrasi dari nol berhasil dan hasilnya sama dengan schema.prisma."

  statis:
    name: Pemeriksaan statis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Backend — type-check
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit

      # Unit test murni (tanpa server & tanpa DB): aturan privasi tiket dan
      # guard peran di controller kritis. Gagal bila guard dihapus/dilunakkan.
      - name: Backend — unit test kritis
        working-directory: backend
        run: npm run test:unit

      - name: Frontend — lint & build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  # Pencegahan §4 SECURITY.md yang selama ini hanya berupa instruksi kepada
  # manusia. Keempat langkah di bawah tidak memakai basis data, jadi murah.
  keamanan:
    name: Rahasia, riwayat, dependensi, header
    runs-on: ubuntu-latest

    # gitleaks-action menulis temuannya sebagai komentar review, jadi butuh
    # akses tulis pada pull-request.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Menyapu riwayat penuh — bukan hanya HEAD — adalah inti job ini.
          fetch-depth: 0

      # Dump dan lampiran adalah kelas kebocoran yang sudah terjadi di repo ini,
      # jadi yang dicocokkan cukup nama berkasnya. Batasnya sengaja rentang yang
      # sedang dikirim, bukan seluruh riwayat: riwayat lama sudah dibersihkan
      # (backups/ = 0 cocok) dan gate yang merah selamanya hanya akan dimatikan
      # orang.
      - name: Tripwire — data pengguna dan kunci penanda tangan tidak boleh ditambahkan
        run: |
          batas=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            batas="${{ github.event.pull_request.base.sha }}"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            batas="${{ github.event.before }}"
          fi
          # Force-push atau cabang baru: 'before' berupa nol / bukan leluhur HEAD.
          if ! git cat-file -e "${batas:-0}^{commit}" 2>/dev/null ||
             ! git merge-base --is-ancestor "$batas" HEAD 2>/dev/null; then
            echo "Batas lama tidak terjangkau; yang diperiksa isi HEAD saja."
            berkas=$(git ls-tree -r --name-only HEAD)
          else
            berkas=$(git diff --name-only "$batas" HEAD)
          fi

          # Migrasi Prisma memang berkas .sql, dan uploads/.gitkeep sengaja
          # dilacak supaya foldernya ada setelah clone. Kunci penanda tangan APK
          # ikut dijaga walau android/.gitignore sudah memuat '*.keystore':
          # 'git add -f' menembus ignore, dan keystore di tangan orang lain =
          # update resmi atas nama aplikasi bisa dikirim pihak luar.
          tersangka=$(printf '%s\n' "$berkas" \
            | grep -E '^backups/|^backend/uploads/|\.sql$|\.(keystore|jks|p12|pfx)$' \
            | grep -vE '^backend/uploads/\.gitkeep$|^backend/prisma/migrations(_archive)?/[^/]+/migration\.sql$' \
            || true)
          if [ -n "$tersangka" ]; then
            echo "Berkas data pribadi/lampiran pengguna tidak boleh masuk repo:"
            echo "$tersangka" | sed 's/^/  /'
            exit 1
          fi
          echo "Bersih: tidak ada dump/lampiran pada rentang ini."

      # .gitignore menjaga berkas baru, tapi tidak bisa menahan orang yang
      # sengaja `git add -f`. Ini yang menahan yang kedua.
      - name: Tripwire — berkas .env yang dilacak tidak melebar
        run: |
          luar=$(git ls-files '*.env*' \
            | grep -vE '(^|/)\.env\.example$|^frontend/\.env\.production$' || true)
          if [ -n "$luar" ]; then
            echo "Berkas env baru ikut terlacak git:"
            echo "$luar" | sed 's/^/  /'
            exit 1
          fi

          # Pengecualian frontend/.env.production hanya sah selama isinya VITE_*:
          # nilai VITE_* memang tertanam di bundel publik sehingga bukan rahasia,
          # sedangkan kunci lain yang diselipkan ke situ akan terpublikasi.
          # Berkasnya wajib ada: tanpa jaga ini, menghapus/mengganti nama berkas
          # membuat 'grep' error dan gerbangnya diam-diam bilang bersih.
          if [ ! -f frontend/.env.production ]; then
            echo "frontend/.env.production tidak ada, padahal pengecualian di"
            echo ".gitignore dan build Vercel sama-sama bergantung padanya."
            exit 1
          fi
          if grep -qvE '^[[:space:]]*(#|$|VITE_[A-Za-z0-9_]+=)' frontend/.env.production; then
            echo "frontend/.env.production memuat kunci di luar VITE_*:"
            grep -nvE '^[[:space:]]*(#|$|VITE_[A-Za-z0-9_]+=)' frontend/.env.production
            exit 1
          fi
          echo "Bersih: hanya env contoh + VITE_API_URL yang terlacak."

      - name: Gitleaks — sapu seluruh riwayat dari kunci yang bocor
        # Tidak dijalankan untuk PR dari fork supaya token GITHUB_TOKEN tidak
        # bisa diekstrak oleh kode pihak luar; push ke main tetap teriksa.
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Hanya diminta akun organisasi. Untuk akun personal boleh kosong.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 'npm audit' membaca package-lock tanpa perlu node_modules.
      # Yang memblokir hanya high/critical. Moderate — misalnya GHSA-w5hq-g745-h8pq
      # pada uuid<11.1.1 yang ikut lewat exceljs — tetap dicetak sebagai laporan,
      # karena moderate yang memaksa setiap PR merah akan berhenti dibaca orang.
      - name: Audit dependensi — backend (hanya produksi)
        working-directory: backend
        run: |
          npm audit --omit=dev
          npm audit --omit=dev --audit-level=high

      - name: Audit dependensi — frontend (hanya produksi)
        working-directory: frontend
        run: |
          npm audit --omit=dev
          npm audit --omit=dev --audit-level=high

      # Terukur 2026-11-14 pada bem-ft-unaya.vercel.app: balasan HTML hanya
      # membawa Strict-Transport-Security (itu milik platform Vercel, bukan kita)
      # — tanpa X-Content-Type-Options, X-Frame-Options, Referrer-Policy, atau
      # Permissions-Policy, sedangkan balasan /api sudah lengkap karena helmet.
      # Keempat header itu jadi harus datang dari vercel.json; kalau bloknya
      # terhapus, tidak ada yang memagari halaman portal dari clickjacking.
      - name: Tripwire — frontend masih mendeklarasikan header keamanannya
        run: |
          node -e '
          const fs = require("fs");
          const j = JSON.parse(fs.readFileSync("vercel.json", "utf8"));

          // Deklarasi boleh di dalam service frontend (yang dipakai sekarang,
          // supaya tidak rangkap dengan header helmet pada /api) atau di level
          // atas. Yang tidak boleh hanyalah tidak ada sama sekali.
          const punya = {};
          const dari = [];
          for (const [nama, daftar] of [
            ["services.frontend.headers", j.services?.frontend?.headers],
            ["headers level atas", j.headers],
          ]) {
            for (const aturan of daftar ?? [])
              for (const h of aturan.headers ?? [])
                if (!(h.key in punya)) punya[h.key] = h.value;
            if ((daftar ?? []).length) dari.push(nama);
          }

          const wajib = [
            "X-Content-Type-Options",
            "X-Frame-Options",
            "Referrer-Policy",
            "Permissions-Policy",
          ];
          const kurang = wajib.filter((k) => !punya[k]);

          // CSP sengaja belum dipasang, dan itu keputusan, bukan kelalaian:
          // tanpa report-to yang menunjuk endpoint pelaporan, kebijakan
          // Report-Only tidak punya efek apa pun (MDN, diakses 2026-11-14), dan
          // mode memaksa akan memecahkan Google Analytics + tema gelap lebih
          // dulu karena frontend/index.html dan hasil build Vite memuat tiga
          // skrip inline yang butuh nonce. Kalau CSP ditambahkan nanti,
          // direktif intinya ikut dijaga di sini — termasuk report-to, supaya
          // yang ditambahkan adalah CSP yang berfungsi, bukan hiasan.
          const csp = punya["Content-Security-Policy"] ??
                      punya["Content-Security-Policy-Report-Only"];
          if (csp) {
            for (const d of ["default-src", "script-src", "img-src", "connect-src",
                             "worker-src", "frame-ancestors", "object-src", "report-to"]) {
              if (!csp.includes(d)) {
                console.error("CSP kehilangan direktif:", d);
                process.exit(1);
              }
            }
          }
          if (kurang.length) {
            console.error("Header hilang dari vercel.json:", kurang.join(", "));
            process.exit(1);
          }
          console.log("Header frontend utuh, dideklarasikan di:", dari.join(" + "));
          console.log("CSP:", csp ? "terpasang" : "belum (sengaja — lihat catatan di atas)");
          '
