<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />

  <!-- Sambungkan lebih awal ke origin gambar & analitik: menghemat ratusan
       milidetik pada permintaan gambar/JavaScript pertama (LCP). -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
  <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  <link rel="preconnect" href="https://www.googletagmanager.com" />

  <!-- Google tag (gtag.js) — 177 KB skrip pihak ketiga ini baru dimuat setelah
       pengunjung berinteraksi (atau 30 detik kemudian), supaya tidak ikut
       diunduh dan diurai saat halaman pertama kali dibuka di jaringan lambat.
       Pengunjung yang benar-benar membaca tetap terukur, hanya tanpa
       menahan render. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    (function () {
      var sudah = false;
      var muat = function () {
        if (sudah) return;
        sudah = true;
        var skrip = document.createElement('script');
        skrip.async = true;
        skrip.src = 'https://www.googletagmanager.com/gtag/js?id=G-P2BN6ZKWHF';
        document.head.appendChild(skrip);
        gtag('js', new Date());
        gtag('config', 'G-P2BN6ZKWHF');
      };
      ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (peristiwa) {
        window.addEventListener(peristiwa, muat, { once: true, passive: true });
      });
      // Cadangan untuk pembaca pasif: tetap terukur setelah 30 detik, jauh
      // setelah halaman selesai dimuat.
      setTimeout(muat, 30000);
      window.__muatAnalitik = muat;
    })();
  </script>

  <link rel="icon" type="image/png" href="/favicon-64.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <!-- iOS < 16.4 mengabaikan "display": standalone pada manifest, jadi
       pemasangan ke layar utama butuh tag lama ini; padanannya yang tidak
       deprecated diminta Chrome (tanpa itu konsol menampilkan peringatan). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BEM FT UNAYA" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Warna chrome browser mengikuti tema aktif (terang: gray-50, gelap: #0a0a0f) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9fafb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0f" />
  <meta name="description"
    content="Portal resmi BEM Fakultas Teknik UNAYA: aspirasi, keluhan, agenda, dan galeri kegiatan mahasiswa." />
  <link rel="canonical" href="https://bem-ft-unaya.vercel.app/" />
  <!-- Kartu bagikan (Open Graph / WhatsApp / Telegram) — gambar 1200x630 dihasilkan
         oleh backend/scripts/generate-og-image.cjs -->
  <meta property="og:site_name" content="BEM FT UNAYA" />
  <meta property="og:locale" content="id_ID" />
  <meta property="og:url" content="https://bem-ft-unaya.vercel.app/" />
  <meta property="og:image" content="https://bem-ft-unaya.vercel.app/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="BEM FT UNAYA — Portal Resmi Fakultas Teknik Universitas Abulyatama" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="BEM FT UNAYA — Portal Resmi" />
  <meta property="og:description"
    content="Sampaikan aspirasi, baca agenda kegiatan, dan lihat dokumentasi BEM Fakultas Teknik Universitas Abulyatama." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BEM FT UNAYA — Portal Resmi" />
  <meta name="twitter:description"
    content="Sampaikan aspirasi, baca agenda kegiatan, dan lihat dokumentasi BEM Fakultas Teknik Universitas Abulyatama." />
  <meta name="twitter:image" content="https://bem-ft-unaya.vercel.app/og-image.png" />
  <title>BEM FT UNAYA</title>
  <script>
    // Terapkan tema tersimpan SEBELUM React dimuat, agar tidak ada kilatan
    // terang (FOUC) pada pengguna tema gelap. Nilai sama dengan yang dipakai
    // ThemeContext; kalau salah satu berubah, ubahlah keduanya.
    (function () {
      try {
        var simpanan = localStorage.getItem('tema');
        var sistemGelap = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var tema = simpanan || (sistemGelap ? 'dark' : 'light');
        var html = document.documentElement;
        if (tema === 'dark') html.classList.add('dark');
        html.style.colorScheme = tema;

        // Tema musiman yang tersimpan dipasang sebelum React dimuat supaya
        // warna musiman tidak berkedip kembali ke aksen bawaan.
        var musiman = localStorage.getItem('tema-musiman');
        if (musiman === 'RAMADAN' || musiman === 'LEBARAN' || musiman === 'NUSANTARA') {
          html.setAttribute('data-musim', musiman);
        }
      } catch (e) {
        /* localStorage diblokir: biarkan tema terang */
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
